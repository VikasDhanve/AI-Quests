    listen [::]:80 default_server;
    server_name 182.92.231.54;
    root /srv/apps/ai-quests/current/public;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;
    open_file_cache off;
    absolute_redirect off;
    access_log /var/log/nginx/ai-quests.access.log main;
